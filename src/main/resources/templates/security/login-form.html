<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · Rooms</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-12 bg-gradient-to-br from-blue-900 to-cyan-500 relative overflow-hidden">

<!-- Ambient background orbs -->
<div class="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
    <div class="absolute -top-32 -left-32 w-96 h-96 rounded-full bg-sky-300/15 blur-3xl"></div>
    <div class="absolute top-1/3 -right-24 w-80 h-80 rounded-full bg-blue-400/20 blur-3xl"></div>
    <div class="absolute -bottom-24 left-1/4 w-72 h-72 rounded-full bg-cyan-300/20 blur-3xl"></div>
</div>

<div class="relative w-full max-w-md">
    
    <!-- Glass card -->
    <div class="backdrop-blur-xl bg-white/15 border border-white/25 rounded-3xl shadow-2xl shadow-black/20 p-8 sm:p-10">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-white/30 to-white/10 border border-white/30 shadow-lg mb-5">
                <svg class="w-8 h-8 text-white drop-shadow" fill="none" stroke="currentColor" stroke-width="1.75"
                     viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
                </svg>
            </div>
            <h1 class="text-3xl font-extrabold text-white tracking-tight drop-shadow-sm">Rooms</h1>
            <p class="mt-2 text-sm text-white/75 font-medium">Sign in to your workspace</p>
        </div>
        
        <!-- Error alert -->
        <div th:if="${param.error}"
             class="mb-6 flex items-start gap-3 rounded-xl bg-red-500/20 border border-red-300/40 backdrop-blur-sm px-4 py-3"
             role="alert">
            <svg class="w-5 h-5 text-red-200 mt-0.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2"
                 viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <div>
                <p class="text-sm font-semibold text-white">Invalid credentials</p>
                <p th:if="${param.error!=null}" th:text="${param.error}" class="text-sm text-red-100/80 mt-0.5"></p>
                <p th:if="${param.error==null}" class="text-sm text-red-100/80 mt-0.5">Check your username and password.</p>
            </div>
        </div>
        
        <!-- Log out success alert -->
        <div th:if="${param.logout}"
             class="mb-6 flex items-start gap-3 rounded-xl bg-emerald-500/20 border border-emerald-300/40 backdrop-blur-sm px-4 py-3"
             role="status">
            <svg class="w-5 h-5 text-emerald-200 mt-0.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2"
                 viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <div>
                <p class="text-sm font-semibold text-white">Signed out</p>
                <p class="text-sm text-emerald-100/80 mt-0.5">You have been logged out successfully.</p>
            </div>
        </div>
        
        <!-- Login form -->
        <form th:action="@{/authenticate}" method="post" class="space-y-5">
            
            <div>
                <div class="relative">
                    <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4">
                        <svg class="w-5 h-5 text-white/50" fill="none" stroke="currentColor" stroke-width="2"
                             viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                    </div>
                    <input
                            type="text"
                            id="username"
                            name="username"
                            autocomplete="username"
                            required
                            autofocus
                            placeholder="Username"
                            class="block w-full rounded-xl border border-white/25 bg-white/10 backdrop-blur-sm pl-12 pr-4 py-3 text-sm text-white placeholder-white/40 shadow-inner focus:border-white/50 focus:bg-white/15 focus:outline-none focus:ring-2 focus:ring-white/30 transition"/>
                </div>
            </div>
            
            <div>
                <div class="relative">
                    <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4">
                        <svg class="w-5 h-5 text-white/50" fill="none" stroke="currentColor" stroke-width="2"
                             viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                    </div>
                    <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            required
                            placeholder="••••••••"
                            class="block w-full rounded-xl border border-white/25 bg-white/10 backdrop-blur-sm pl-12 pr-4 py-3 text-sm text-white placeholder-white/40 shadow-inner focus:border-white/50 focus:bg-white/15 focus:outline-none focus:ring-2 focus:ring-white/30 transition"/>
                </div>
            </div>
            
            <button
                    type="submit"
                    class="w-full mt-2 rounded-xl bg-gradient-to-r from-sky-100 via-white to-blue-50 px-4 py-3 text-sm font-bold text-blue-800 shadow-lg shadow-black/20 hover:shadow-xl hover:scale-[1.02] active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-white/50 focus:ring-offset-2 focus:ring-offset-transparent transition-all duration-200">
                Sign in
            </button>
        
        </form>
    </div>
    
    <p class="mt-8 text-center text-xs font-medium text-white/50 tracking-wide">
        Role-based collaboration &middot; Spring MVC Security
    </p>

</div>

</body>
</html>
