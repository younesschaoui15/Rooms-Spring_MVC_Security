server:
  port: 8080

spring:
  application:
    name: Rooms - Spring MVC Security
  datasource:
    #Docker PostgreSQL db container
    url: jdbc:postgresql://localhost:5454/rooms-db
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


