spring:
  datasource:
    #Docker PostgreSQL db container
    url: jdbc:postgresql://localhost:5454/rooms-db
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
  main:
    banner-mode: off
#  flyway:
#      enabled: true
#      locations: classpath:db/migration

logging:
#  pattern:
#    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level %pid - [%15.15t] %-40.40logger{39} : %msg%n"
  level:
    root: warn
    org.hibernate.SQL: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
  include-application-name: false
