server:
  port: 8081

spring:
  datasource:
    #Docker PostgreSQL db container
    url: jdbc:postgresql://localhost:5454/rooms-db
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20


