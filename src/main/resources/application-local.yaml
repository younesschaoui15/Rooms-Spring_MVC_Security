server:
  port: 8080

spring:
  datasource:
    #Docker PostgreSQL db container
    url: jdbc:postgresql://localhost:5454/rooms-db
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
#  pattern:
#    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level %pid - [%15.15t] %-40.40logger{39} : %msg%n"
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
  include-application-name: false
