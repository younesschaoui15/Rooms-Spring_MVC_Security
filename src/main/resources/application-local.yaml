spring:
  datasource:
    #PostgreSQL db (in the host machine)
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rooms-db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
  main:
    banner-mode: off
#  flyway:
#      enabled: true
#      locations: classpath:db/migration

logging:
  include-application-name: false
  level:
    root: info
    org.hibernate.SQL: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
#  pattern:
#    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level %pid - [%15.15t] %-40.40logger{39} : %msg%n"