spring:
  datasource:
    #Docker PostgreSQL Tests db container
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rooms-tests-db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20


